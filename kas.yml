header:
  version: 14

machine: hadron-ngx012
distro: poky
target: hadron-image-base

repos:
  poky:
    url: https://git.yoctoproject.org/poky
    branch: scarthgap
    layers:
      meta:
      meta-poky:

  meta-openembedded:
    url: https://github.com/openembedded/meta-openembedded
    branch: scarthgap
    layers:
      meta-oe:
      meta-python:
      meta-networking:
      meta-filesystems:
      meta-gnome:
      meta-multimedia:
      meta-xfce:

  meta-tegra:
    url: https://github.com/OE4T/meta-tegra
    branch: scarthgap
    commit: 447c21467f65be2389f68a189b6871f13729d222
    layers:
      .:

  meta-hadron:
    path: sources/meta-hadron
    layers:
      .:

  meta-virtualization:
    url: https://git.yoctoproject.org/meta-virtualization
    branch: scarthgap
    layers:
      .:

local_conf_header:
  standard: |
    BB_NUMBER_THREADS ?= "${@oe.utils.cpu_count()}"
    PARALLEL_MAKE ?= "-j ${@oe.utils.cpu_count()}"
    DL_DIR = "/media/ranshal/jetson/shared/downloads"
    SSTATE_DIR = "/media/ranshal/jetson/shared/sstate"
    IMAGE_ROOTFS_SIZE = "8388608"
    INIT_MANAGER = "systemd"
    LICENSE_FLAGS_ACCEPTED += "commercial"
    # Docker (docker-moby) from meta-virtualization requires the virtualization distro feature.
    DISTRO_FEATURES:append = " virtualization"
    # OpenCV: disable CUDA build — we only need Python bindings, not GPU acceleration.
    # gcc-for-nvcc-cross fails to compile on Ubuntu 22.04 host (GCC 13.2 linker errors).
    PACKAGECONFIG:remove:pn-opencv = "cuda dnn"
