# Fastboot kernel deltas — build the NVMe storage stack into the kernel (=y)
# instead of loading it as modules from the initramfs. The Hadron rootfs is
# always on /dev/nvme0n1p1, which sits behind the Tegra PCIe controller, so the
# whole chain must be built-in for the kernel to mount root without an initramfs:
#   phy-tegra194-p2u -> pcie-tegra194 -> nvme-core -> nvme
# EXT4 is already =y in the base defconfig.
#
# This is the prerequisite for dropping tegra-minimal-initramfs (see the plan's
# "Deferred / needs-HW-validation" section). Committing it alone does not change
# boot-till-ping, but it removes the module-load + initramfs hop once the
# no-initramfs machine change is validated on hardware.
CONFIG_PHY_TEGRA194_P2U=y
CONFIG_PCIE_TEGRA194=y
CONFIG_PCIE_TEGRA194_HOST=y
CONFIG_NVME_CORE=y
CONFIG_BLK_DEV_NVME=y

# NOTE: the eth0 NIC is the OUT-OF-TREE Realtek r8168 driver
# (nvidia-kernel-oot: nv-kernel-module-r8168), NOT the in-kernel r8169. It
# therefore cannot be made built-in with a Kconfig symbol here. Bringing eth0 up
# in-kernel via an `ip=` cmdline (earliest ICMP) requires either patching r8168
# into the kernel tree or switching to CONFIG_R8169=y — both need on-hardware
# validation and are tracked as deferred tasks in the plan.
